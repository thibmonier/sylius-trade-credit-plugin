#
# tmonier_sylius_trade_credit:
#     resource: "@TmonierSyliusTradeCreditPlugin/config/routes.yaml"

tmonier_trade_credit_admin:
    resource: "@TmonierSyliusTradeCreditPlugin/config/routes/admin.yaml"
    prefix: '/%sylius_admin.path_name%'

tmonier_trade_credit_shop:
    resource: "@TmonierSyliusTradeCreditPlugin/config/routes/shop.yaml"
    prefix: /{_locale}
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
